<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="furGradHuysuz" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9F43"/>
      <stop offset="100%" stop-color="#EE5253"/>
    </linearGradient>
    <style>
      .paw-tap {
        transform-origin: 195px 230px;
        animation: tapKeyboard 0.8s ease-in-out infinite alternate;
      }
      .tail-grumpy {
        transform-origin: 230px 240px;
        animation: aggressiveTail 1.2s ease-in-out infinite alternate;
      }
      .anger-mark {
        transform-origin: 215px 95px;
        animation: pulseAnger 1.5s ease-in-out infinite;
      }
      @keyframes tapKeyboard {
        0% { transform: rotate(0deg) translateY(0px); }
        100% { transform: rotate(-15deg) translateY(-8px); }
      }
      @keyframes aggressiveTail {
        0% { transform: rotate(-15deg); }
        100% { transform: rotate(25deg); }
      }
      @keyframes pulseAnger {
        0%, 100% { transform: scale(0.9); opacity: 0.8; }
        50% { transform: scale(1.2); opacity: 1; }
      }
    </style>
  </defs>

  <!-- Arka Plan Uyarı Çemberi -->
  <circle cx="160" cy="160" r="140" fill="#FFF0F0" opacity="0.5"/>

  <!-- Öfke / Kızgınlık Çapraz İşareti (#) -->
  <g class="anger-mark" stroke="#E74C3C" stroke-width="3.5" stroke-linecap="round">
    <path d="M210,80 Q225,85 220,105"/>
    <path d="M225,85 Q210,95 230,102"/>
  </g>

  <!-- Hızlı sallanan kuyruk -->
  <path class="tail-grumpy" d="M220,225 Q275,190 260,150 Q250,140 242,150 Q248,180 220,210 Z" fill="url(#furGradHuysuz)" stroke="#C0392B" stroke-width="4" stroke-linecap="round"/>

  <!-- Gövde -->
  <ellipse cx="160" cy="225" rx="76" ry="63" fill="url(#furGradHuysuz)" stroke="#C0392B" stroke-width="4"/>
  <!-- Göbek -->
  <ellipse cx="160" cy="230" rx="46" ry="38" fill="#FFF0E6"/>

  <!-- Kulaklar -->
  <polygon points="80,135 70,85 125,115" fill="url(#furGradHuysuz)" stroke="#C0392B" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="88,128 78,95 118,114" fill="#FFAAA6"/>

  <polygon points="240,135 250,85 195,115" fill="url(#furGradHuysuz)" stroke="#C0392B" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="232,128 242,95 202,114" fill="#FFAAA6"/>

  <!-- Kafa -->
  <circle cx="160" cy="142" r="62" fill="url(#furGradHuysuz)" stroke="#C0392B" stroke-width="4"/>

  <!-- Çatık Kaşlar ve Yan Bakış Gözler -->
  <g>
    <!-- Sol Kaş & Göz -->
    <path d="M120,126 L148,136" stroke="#2B1810" stroke-width="4.5" stroke-linecap="round"/>
    <ellipse cx="134" cy="144" rx="10" ry="8" fill="#FFEAA7"/>
    <circle cx="137" cy="144" r="5" fill="#2B1810"/>
    <circle cx="139" cy="142" r="1.5" fill="#FFFFFF"/>

    <!-- Sağ Kaş & Göz -->
    <path d="M200,126 L172,136" stroke="#2B1810" stroke-width="4.5" stroke-linecap="round"/>
    <ellipse cx="186" cy="144" rx="10" ry="8" fill="#FFEAA7"/>
    <circle cx="183" cy="144" r="5" fill="#2B1810"/>
    <circle cx="185" cy="142" r="1.5" fill="#FFFFFF"/>
  </g>

  <!-- Burun & Huysuz Ağız -->
  <polygon points="156,152 164,152 160,157" fill="#C0392B"/>
  <path d="M148,166 Q160,159 172,166" fill="none" stroke="#2B1810" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Bıyıklar -->
  <line x1="85" y1="148" x2="118" y2="152" stroke="#2B1810" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="88" y1="160" x2="118" y2="158" stroke="#2B1810" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="235" y1="148" x2="202" y2="152" stroke="#2B1810" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="232" y1="160" x2="202" y2="158" stroke="#2B1810" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Sol Pati -->
  <ellipse cx="118" cy="225" rx="12" ry="10" fill="url(#furGradHuysuz)" stroke="#C0392B" stroke-width="3"/>

  <!-- Sağ Pati (Klavyeye vurmaya hazır) -->
  <g class="paw-tap">
    <ellipse cx="195" cy="220" rx="14" ry="11" fill="url(#furGradHuysuz)" stroke="#C0392B" stroke-width="3"/>
    <path d="M185,214 L183,209 M193,211 L193,205 M201,213 L204,208" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Mini Klavye -->
  <rect x="110" y="258" width="100" height="12" rx="4" fill="#2D3436" stroke="#636E72" stroke-width="2"/>
  <line x1="120" y1="264" x2="126" y2="264" stroke="#DFE6E9" stroke-width="3"/>
  <line x1="132" y1="264" x2="138" y2="264" stroke="#DFE6E9" stroke-width="3"/>
  <line x1="144" y1="264" x2="156" y2="264" stroke="#DFE6E9" stroke-width="3"/>
  <line x1="162" y1="264" x2="168" y2="264" stroke="#DFE6E9" stroke-width="3"/>
  <line x1="174" y1="264" x2="180" y2="264" stroke="#DFE6E9" stroke-width="3"/>
  <line x1="186" y1="264" x2="198" y2="264" stroke="#DFE6E9" stroke-width="3"/>
</svg>
