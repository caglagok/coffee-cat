<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%" fill="none">
  <defs>
    <style>
      .zzz-1 {
        animation: floatZzz 3s ease-in-out infinite;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        fill: #FFC6A8;
      }
      .zzz-2 {
        animation: floatZzz 3s ease-in-out 1s infinite;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        fill: #FFC6A8;
      }
      .zzz-3 {
        animation: floatZzz 3s ease-in-out 2s infinite;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        fill: #FFC6A8;
      }
      .head-nod {
        transform-origin: 160px 210px;
        animation: sleepyNod 4s ease-in-out infinite;
      }
      @keyframes floatZzz {
        0% { opacity: 0; transform: translate(0px, 0px) scale(0.6); }
        40% { opacity: 0.9; transform: translate(10px, -15px) scale(1); }
        80% { opacity: 0.7; transform: translate(22px, -32px) scale(1.3); }
        100% { opacity: 0; transform: translate(30px, -45px) scale(1.5); }
      }
      @keyframes sleepyNod {
        0%, 100% { transform: rotate(0deg) translateY(0px); }
        50% { transform: rotate(2.5deg) translateY(5px); }
      }
    </style>
  </defs>

  <circle cx="160" cy="160" r="145" stroke="#741A2F" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.35"/>

  <!-- Zzz -->
  <g>
    <text x="215" y="90" font-size="16" class="zzz-1">z</text>
    <text x="238" y="70" font-size="22" class="zzz-2">Z</text>
    <text x="268" y="45" font-size="28" class="zzz-3">Z</text>
  </g>

  <!-- Gövde -->
  <path d="M90,260 C90,205 130,200 160,200 C190,200 230,205 230,260" stroke="#741A2F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Kafa ve Kulaklar -->
  <g class="head-nod">
    <!-- Sol Kulak (Düşük) -->
    <path d="M92,135 L82,82 L132,112" stroke="#741A2F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M98,124 L90,95 L122,112" stroke="#FFC6A8" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Sağ Kulak (Düşük) -->
    <path d="M228,135 L238,82 L188,112" stroke="#741A2F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M222,124 L230,95 L198,112" stroke="#FFC6A8" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Kafa -->
    <path d="M132,112 C140,110 150,108 160,108 C170,108 180,110 188,112 C222,122 232,160 220,192 C208,220 112,220 100,192 C88,160 98,122 132,112 Z" stroke="#741A2F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="#241A1F"/>

    <!-- Uykulu / Kapanan Gözler -->
    <path d="M122,150 C130,158 142,158 150,150" stroke="#FFC6A8" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M170,150 C178,158 190,158 198,150" stroke="#FFC6A8" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Esneyen Ağız -->
    <path d="M157,160 L163,160 L160,164 Z" fill="#FFC6A8"/>
    <ellipse cx="160" cy="173" rx="6" ry="8" stroke="#FFC6A8" stroke-width="2.5"/>

    <!-- Bıyıklar -->
    <line x1="88" y1="158" x2="114" y2="164" stroke="#FFC6A8" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
    <line x1="86" y1="170" x2="112" y2="173" stroke="#FFC6A8" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
    <line x1="232" y1="158" x2="206" y2="164" stroke="#FFC6A8" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
    <line x1="234" y1="170" x2="208" y2="173" stroke="#FFC6A8" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- Patiler -->
  <path d="M110,245 C125,240 140,240 145,250" stroke="#FFC6A8" stroke-width="3" stroke-linecap="round"/>
  <path d="M210,245 C195,240 180,240 175,250" stroke="#FFC6A8" stroke-width="3" stroke-linecap="round"/>
</svg>
